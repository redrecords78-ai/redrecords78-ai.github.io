<style>
:root {
  --red: #E8192C; --red2: #FF3347;
  --black: #080808; --black2: #0F0F0F; --black3: #161616;
  --white: #F2F2F2; --gray: #888; --gray2: #444;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow-x: hidden; background: #080808; }

/* Overlay transition inter-pages */
#page-overlay {
  position: fixed; inset: 0; z-index: 99;
  background: #080808; pointer-events: none;
  transition: opacity 0.2s ease;
}
body {
  background: var(--black); color: var(--white);
  font-family: 'DM Sans', sans-serif; font-weight: 300;
  line-height: 1.6; overflow-x: hidden; padding-bottom: 80px;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 999; opacity: 0.4;
}

/* NAV */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  padding: calc(1.25rem + var(--safe-top)) 2rem 1.25rem;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  background: rgba(8,8,8,0.9); backdrop-filter: blur(12px);
}
.nav-back { color: var(--gray); display: flex; align-items: center; padding: 6px; transition: color 0.2s; }
.nav-back:hover { color: var(--white); }
.nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.nav-logo .r-mark { width: 34px; height: 34px; border-radius: 10px; object-fit: cover; display: block; flex-shrink: 0; }
.nav-logo-text { display: flex; flex-direction: column; line-height: 1; }
.nav-logo-main { font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 3px; color: var(--white); }
.nav-logo-main em { color: var(--red); font-style: normal; }
.nav-links { display: flex; gap: 1.5rem; list-style: none; }
.nav-links a { color: var(--gray); text-decoration: none; font-size: 13px; letter-spacing: 0.05em; transition: color 0.2s; }
.nav-links a:hover { color: var(--white); }
.nav-links a.active { color: var(--red); }
.nav-cta { background: var(--red); color: white !important; padding: 8px 18px; font-size: 13px; text-decoration: none; letter-spacing: 0.05em; transition: background 0.2s; border-radius: 8px; }
.nav-cta:hover { background: var(--red2); }

/* PAGE HEADER */
.page-header { padding: 6rem 2rem 1rem; max-width: 1000px; margin: 0 auto; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
.header-left {}
.section-tag { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--red); margin-bottom: 0.5rem; display: flex; align-items: center; gap: 10px; }
.section-tag::before { content: ''; display: block; width: 24px; height: 1px; background: var(--red); }
.section-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(32px, 5vw, 52px); letter-spacing: 2px; line-height: 1; }
.count-badge { font-size: 12px; color: var(--gray); padding-bottom: 6px; }

/* FILTRES */
.filters-wrap { max-width: 1000px; margin: 0 auto; padding: 1rem 2rem 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.05); position: sticky; top: 72px; background: rgba(8,8,8,0.95); backdrop-filter: blur(12px); z-index: 50; }
.filters { display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filter-btn {
  padding: 5px 14px; border: 1px solid var(--gray2);
  background: transparent; color: var(--gray);
  font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif;
  white-space: nowrap; flex-shrink: 0; border-radius: 20px;
}
.filter-btn:hover { border-color: var(--white); color: var(--white); }
.filter-btn.active { border-color: var(--red); color: var(--red); background: rgba(232,25,44,0.08); }

/* LISTE */
.instru-wrap { max-width: 1000px; margin: 0 auto; padding: 0.5rem 2rem 4rem; }
.instru-list { display: flex; flex-direction: column; gap: 1px; background: var(--gray2); border-radius: 12px; overflow: hidden; }
.instru-row {
  background: var(--black2); padding: 0.75rem 1.25rem;
  display: flex; align-items: center; gap: 1rem;
  transition: background 0.15s; cursor: pointer;
}
.instru-row:hover { background: var(--black3); }
.instru-row.active { background: var(--black3); border-left: 2px solid var(--red); padding-left: calc(1.25rem - 2px); }
.instru-num { font-family: 'Bebas Neue', sans-serif; font-size: 16px; color: var(--gray2); min-width: 24px; text-align: center; flex-shrink: 0; }
.instru-row.active .instru-num { color: var(--red); }
.instru-play-btn {
  width: 28px; height: 28px; border: 1px solid var(--gray2); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s;
}
.instru-row:hover .instru-play-btn { border-color: var(--white); }
.instru-row.active .instru-play-btn { border-color: var(--red); background: rgba(232,25,44,0.1); }
.instru-info { flex: 1; min-width: 0; }
.instru-name { font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 1px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.instru-meta { font-size: 10px; color: var(--gray); margin-top: 1px; letter-spacing: 0.05em; }
.instru-genre-tag { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--red); border: 1px solid rgba(232,25,44,0.3); padding: 1px 5px; flex-shrink: 0; }
.instru-price { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--white); flex-shrink: 0; }
.instru-price span { font-size: 11px; color: var(--gray); }
.instru-buy-btn {
  background: transparent; border: 1px solid var(--gray2); color: var(--gray);
  padding: 5px 12px; font-size: 10px; cursor: pointer; transition: all 0.2s;
  font-family: 'DM Sans', sans-serif; text-decoration: none;
  display: flex; align-items: center; flex-shrink: 0;
  letter-spacing: 0.08em; text-transform: uppercase; border-radius: 20px;
}
.instru-buy-btn:hover { border-color: var(--red); color: var(--red); }
.instru-row.active .instru-buy-btn { background: var(--red); border-color: var(--red); color: #fff; }
.empty-msg { padding: 3rem 0; text-align: center; color: var(--gray); font-size: 14px; }

/* Égaliseur animé sur le morceau en lecture */
.eq { display: none; align-items: flex-end; gap: 2px; height: 14px; min-width: 24px; justify-content: center; flex-shrink: 0; }
.eq span { width: 3px; height: 100%; background: var(--red); border-radius: 1px; transform-origin: bottom; animation: eqb 0.9s ease-in-out infinite; }
.eq span:nth-child(1) { animation-delay: -0.4s; }
.eq span:nth-child(2) { animation-delay: -0.15s; }
.eq span:nth-child(3) { animation-delay: -0.65s; }
@keyframes eqb { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1); } }
.instru-row.active .eq { display: flex; }
.instru-row.active .instru-num { display: none; }
body.audio-paused .eq span { animation-play-state: paused; }

/* MINI PLAYER */
#mini-player {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  background: rgba(15,15,15,0.97); backdrop-filter: blur(20px);
  border-top: 1px solid var(--gray2); border-radius: 20px 20px 0 0;
  padding: 0 1.5rem; height: 72px; display: none; align-items: center; gap: 1rem;
}
#mini-player.visible { display: flex; }
.mp-cover { width: 44px; height: 44px; background: var(--black3); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--red); }
.mp-info { flex: 1; min-width: 0; }
.mp-title { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 1px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mp-sub { font-size: 11px; color: var(--gray); margin-top: 2px; }
.mp-progress-wrap { flex: 1.5; display: flex; flex-direction: column; gap: 6px; }
.mp-times { display: flex; justify-content: space-between; font-size: 10px; color: var(--gray); }
#mp-seek {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 4px; border-radius: 2px;
  outline: none; cursor: pointer;
  background: linear-gradient(to right, var(--red) 0%, var(--gray2) 0%);
}
#mp-seek::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--red); cursor: pointer;
  box-shadow: 0 0 6px rgba(232,25,44,0.6);
}
#mp-seek::-moz-range-thumb {
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--red); cursor: pointer; border: none;
  box-shadow: 0 0 6px rgba(232,25,44,0.6);
}
.mp-controls { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.mp-btn { background: none; border: none; color: var(--white); cursor: pointer; padding: 6px; display: flex; align-items: center; transition: color 0.2s; }
.mp-btn:hover { color: var(--red); }
.mp-btn.play-pause { width: 38px; height: 38px; border: 1px solid var(--gray2); border-radius: 50%; justify-content: center; }
.mp-btn.play-pause:hover { border-color: var(--red); }
.mp-close { color: var(--gray); font-size: 18px; }

/* FOOTER */
footer { border-top: 1px solid var(--gray2); padding: 2rem; display: flex; align-items: center; justify-content: space-between; max-width: 1000px; margin: 0 auto; }
.footer-logo { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 3px; color: var(--gray); }
.footer-logo span { color: var(--red); }

/* BOTTOM NAV — identique index.html */
#bottom-nav {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 150;
  background: rgba(10,10,10,0.98); backdrop-filter: blur(20px) saturate(180%);
  border-top: 1px solid rgba(255,255,255,0.07);
  height: calc(64px + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  overflow: visible; /* le disque Réserver dépasse vers le haut */
}
.bn-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px;
  text-decoration: none; color: #555;
  font-size: 9px; letter-spacing: 0.03em;
  font-family: 'DM Sans', sans-serif; font-weight: 400;
  transition: color 0.2s; white-space: nowrap; min-width: 0;
  background: none; border: none; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  position: relative;
}
.bn-item.active { color: var(--red); }
.bn-item:not(.active) { color: #888; }
.bn-item svg {
  width: 22px; height: 22px; flex-shrink: 0;
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.bn-item:active svg { transform: scale(0.9); }
.bn-item.active::after {
  content: ''; display: block;
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--red);
  position: absolute; bottom: 6px;
}
/* CTA central Réserver — disque surélevé */
.bn-cta {
  flex: 1; display: flex; align-items: center; justify-content: center;
  text-decoration: none; -webkit-tap-highlight-color: transparent;
}
.bn-disc {
  width: 52px; height: 52px; border-radius: 50%; background: var(--red);
  display: flex; align-items: center; justify-content: center; margin-top: -26px;
  box-shadow: 0 8px 24px rgba(232,25,44,0.45), 0 0 0 5px var(--black);
  transition: transform 0.15s;
}
.bn-cta:active .bn-disc { transform: scale(0.92); }

@media (max-width: 700px) {
  .nav-links { display: none; }
  .instru-genre-tag { display: none; }
  footer { justify-content: center; }
  #bottom-nav { display: flex; }
  #mini-player { bottom: calc(72px + var(--safe-bottom)); flex-wrap: wrap; height: auto; padding: 10px 1rem; gap: 8px; }
  .mp-progress-wrap { order: 3; flex: 0 0 100%; }
  body { padding-top: calc(80px + var(--safe-top)); padding-bottom: calc(96px + var(--safe-bottom)); }
}
</style>

// ─── CATALOGUE ────────────────────────────────────────────────────────────────
const wa = t => 'https://wa.me/33759476247?text=' + encodeURIComponent('Bonjour, je souhaite acheter l\'instrumentale "' + t + '" (30€)');

let allInstrus = [];
let activeFilter = 'Tous';

function loadInstrus() {
  allInstrus = LOCAL_INSTRUS.map(t => ({ ...t, price: '30', buyLink: wa(t.title) }));
  buildFilters();
  renderList();
}

// Securite : echappe le HTML des donnees (titres/genres viennent du Google Sheet).
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function buildFilters() {
  const genres = ['Tous', ...new Set(allInstrus.map(t => t.genre))];
  const wrap = document.getElementById('filters');
  wrap.innerHTML = genres.map(g =>
    `<button class="filter-btn${g === activeFilter ? ' active' : ''}" onclick="setFilter('${g}')">${esc(g)}</button>`
  ).join('');
}

function setFilter(genre) {
  activeFilter = genre;
  buildFilters();
  renderList();
}

function renderList() {
  const filtered = activeFilter === 'Tous' ? allInstrus : allInstrus.filter(t => t.genre === activeFilter);
  const list = document.getElementById('instru-list');
  document.getElementById('count-badge').textContent = filtered.length + ' beat' + (filtered.length > 1 ? 's' : '');

  if (!filtered.length) {
    list.innerHTML = '<div class="empty-msg">Aucune instru dans cette catégorie.</div>';
    return;
  }

  list.innerHTML = filtered.map((t, i) => `
    <div class="instru-row" data-id="${t.id}" onclick="playTrack('${t.id}')">
      <div class="instru-num">${String(i+1).padStart(2,'0')}</div>
      <div class="eq"><span></span><span></span><span></span></div>
      <div class="instru-play-btn">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <div class="instru-info">
        <div class="instru-name">${esc(t.title)}</div>
        <div class="instru-meta">${t.bpm && t.bpm !== '—' ? esc(t.bpm) + ' BPM' : ''}</div>
      </div>
      <span class="instru-genre-tag">${esc(t.genre)}</span>
      <div class="instru-price">${t.price}<span>€</span></div>
      <a class="instru-buy-btn" href="${t.buyLink}" target="_blank" onclick="event.stopPropagation()">Acheter</a>
    </div>`
  ).join('');
}

loadInstrus();

// ─── PLAYER ──────────────────────────────────────────────────────────────────
const audio = new Audio();
let currentId = null;

function fmtTime(s) {
  if (isNaN(s)) return '0:00';
  return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
}
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration * 100);
  const seek = document.getElementById('mp-seek');
  seek.value = pct;
  seek.style.background = `linear-gradient(to right, var(--red) ${pct}%, var(--gray2) ${pct}%)`;
  document.getElementById('mp-cur').textContent = fmtTime(audio.currentTime);
});
document.getElementById('mp-seek').addEventListener('input', function() {
  if (audio.duration) audio.currentTime = (this.value / 100) * audio.duration;
});
audio.addEventListener('loadedmetadata', () => {
  document.getElementById('mp-dur').textContent = fmtTime(audio.duration);
});
audio.addEventListener('ended', () => setPlayIcon(false));

function setPlayIcon(p) {
  document.getElementById('mp-icon-play').style.display = p ? 'none' : 'block';
  document.getElementById('mp-icon-pause').style.display = p ? 'block' : 'none';
  document.body.classList.toggle('audio-paused', !p);
}

function playTrack(id) {
  if (currentId === id) { togglePlay(); return; }
  const t = allInstrus.find(x => x.id === id);
  if (!t) return;
  currentId = id;
  audio.src = t.src;
  audio.play().catch(() => {});
  setPlayIcon(true);
  document.getElementById('mp-title').textContent = t.title;
  document.getElementById('mp-sub').textContent = t.genre + ' · Red Records';
  document.getElementById('mini-player').classList.add('visible');
  document.querySelectorAll('.instru-row').forEach(r => r.classList.remove('active'));
  const row = document.querySelector('.instru-row[data-id="' + id + '"]');
  if (row) row.classList.add('active');
}

function togglePlay() {
  if (audio.paused) { audio.play(); setPlayIcon(true); }
  else { audio.pause(); setPlayIcon(false); }
}



function closePlayer() {
  audio.pause(); audio.src = ''; currentId = null; setPlayIcon(false);
  document.getElementById('mini-player').classList.remove('visible');
  document.querySelectorAll('.instru-row').forEach(r => r.classList.remove('active'));
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

// Overlay transition — nav toujours visible (z-index 100 > overlay 99)
(function() {
  var ov = document.getElementById('page-overlay');
  requestAnimationFrame(function() { ov.style.opacity = '0'; });
  document.addEventListener('click', function(e) {
    var link = e.target.closest('#bottom-nav a, nav a.nav-logo, nav a.nav-back');
    if (!link) return;
    var href = link.getAttribute('href');
    if (!href || href.startsWith('#') || href.startsWith('mailto') || href.startsWith('tel')) return;
    e.preventDefault();
    ov.style.opacity = '1';
    setTimeout(function() { window.location.href = href; }, 180);
  });
})();
