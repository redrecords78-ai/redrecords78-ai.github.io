<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instrumentales · Red Records 78</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E8192C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --red: #E8192C; --red2: #FF3347;
  --black: #080808; --black2: #0F0F0F; --black3: #161616;
  --white: #F2F2F2; --gray: #888; --gray2: #444;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--black); color: var(--white);
  font-family: 'DM Sans', sans-serif; font-weight: 300;
  line-height: 1.6; overflow-x: hidden; padding-bottom: 80px;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 999; opacity: 0.4;
}

/* NAV */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  padding: 1.25rem 2rem;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  background: rgba(8,8,8,0.9); backdrop-filter: blur(12px);
}
.nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.nav-logo .r-mark {
  width: 34px; height: 34px; background: var(--red);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: white;
}
.nav-logo span { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px; color: var(--white); }
.nav-links { display: flex; gap: 1.5rem; list-style: none; }
.nav-links a { color: var(--gray); text-decoration: none; font-size: 13px; letter-spacing: 0.05em; transition: color 0.2s; }
.nav-links a:hover { color: var(--white); }
.nav-links a.active { color: var(--red); }
.nav-cta { background: var(--red); color: white !important; padding: 8px 18px; font-size: 13px; text-decoration: none; letter-spacing: 0.05em; transition: background 0.2s; }
.nav-cta:hover { background: var(--red2); }

/* PAGE HEADER */
.page-header { padding: 6rem 2rem 1rem; max-width: 1000px; margin: 0 auto; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
.header-left {}
.section-tag { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--red); margin-bottom: 0.5rem; display: flex; align-items: center; gap: 10px; }
.section-tag::before { content: ''; display: block; width: 24px; height: 1px; background: var(--red); }
.section-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(32px, 5vw, 52px); letter-spacing: 2px; line-height: 1; }
.count-badge { font-size: 12px; color: var(--gray); padding-bottom: 6px; }

/* FILTRES */
.filters-wrap { max-width: 1000px; margin: 0 auto; padding: 1rem 2rem 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.05); position: sticky; top: 72px; background: rgba(8,8,8,0.95); backdrop-filter: blur(12px); z-index: 50; }
.filters { display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filter-btn {
  padding: 5px 14px; border: 1px solid var(--gray2);
  background: transparent; color: var(--gray);
  font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif;
  white-space: nowrap; flex-shrink: 0;
}
.filter-btn:hover { border-color: var(--white); color: var(--white); }
.filter-btn.active { border-color: var(--red); color: var(--red); background: rgba(232,25,44,0.08); }

/* LISTE */
.instru-wrap { max-width: 1000px; margin: 0 auto; padding: 0.5rem 2rem 4rem; }
.instru-list { display: flex; flex-direction: column; gap: 1px; background: var(--gray2); }
.instru-row {
  background: var(--black2); padding: 0.75rem 1.25rem;
  display: flex; align-items: center; gap: 1rem;
  transition: background 0.15s; cursor: pointer;
}
.instru-row:hover { background: var(--black3); }
.instru-row.active { background: var(--black3); border-left: 2px solid var(--red); padding-left: calc(1.25rem - 2px); }
.instru-num { font-family: 'Bebas Neue', sans-serif; font-size: 16px; color: var(--gray2); min-width: 24px; text-align: center; flex-shrink: 0; }
.instru-row.active .instru-num { color: var(--red); }
.instru-play-btn {
  width: 28px; height: 28px; border: 1px solid var(--gray2); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s;
}
.instru-row:hover .instru-play-btn { border-color: var(--white); }
.instru-row.active .instru-play-btn { border-color: var(--red); background: rgba(232,25,44,0.1); }
.instru-info { flex: 1; min-width: 0; }
.instru-name { font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 1px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.instru-meta { font-size: 10px; color: var(--gray); margin-top: 1px; letter-spacing: 0.05em; }
.instru-genre-tag { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--red); border: 1px solid rgba(232,25,44,0.3); padding: 1px 5px; flex-shrink: 0; }
.instru-price { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--white); flex-shrink: 0; }
.instru-price span { font-size: 11px; color: var(--gray); }
.instru-buy-btn {
  background: var(--red); border: none; color: white;
  padding: 5px 10px; font-size: 10px; cursor: pointer; transition: background 0.2s;
  font-family: 'DM Sans', sans-serif; text-decoration: none;
  display: flex; align-items: center; flex-shrink: 0;
  letter-spacing: 0.08em; text-transform: uppercase;
}
.instru-buy-btn:hover { background: var(--red2); }
.empty-msg { padding: 3rem 0; text-align: center; color: var(--gray); font-size: 14px; }

/* MINI PLAYER */
#mini-player {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  background: rgba(15,15,15,0.97); backdrop-filter: blur(20px);
  border-top: 1px solid var(--gray2);
  padding: 0 1.5rem; height: 72px; display: none; align-items: center; gap: 1rem;
}
#mini-player.visible { display: flex; }
.mp-cover { width: 44px; height: 44px; background: var(--black3); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--red); }
.mp-info { flex: 1; min-width: 0; }
.mp-title { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 1px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mp-sub { font-size: 11px; color: var(--gray); margin-top: 2px; }
.mp-progress-wrap { flex: 1.5; display: flex; flex-direction: column; gap: 4px; }
.mp-progress { width: 100%; height: 3px; background: var(--gray2); cursor: pointer; border-radius: 2px; }
.mp-progress-bar { height: 100%; background: var(--red); border-radius: 2px; width: 0%; transition: width 0.1s linear; pointer-events: none; }
.mp-times { display: flex; justify-content: space-between; font-size: 10px; color: var(--gray); }
.mp-controls { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.mp-btn { background: none; border: none; color: var(--white); cursor: pointer; padding: 6px; display: flex; align-items: center; transition: color 0.2s; }
.mp-btn:hover { color: var(--red); }
.mp-btn.play-pause { width: 38px; height: 38px; border: 1px solid var(--gray2); border-radius: 50%; justify-content: center; }
.mp-btn.play-pause:hover { border-color: var(--red); }
.mp-close { color: var(--gray); font-size: 18px; }

/* FOOTER */
footer { border-top: 1px solid var(--gray2); padding: 2rem; display: flex; align-items: center; justify-content: space-between; max-width: 1000px; margin: 0 auto; }
.footer-logo { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 3px; color: var(--gray); }
.footer-logo span { color: var(--red); }

@media (max-width: 700px) {
  .nav-links { display: none; }
  .mp-progress-wrap { display: none; }
  .instru-genre-tag { display: none; }
  footer { justify-content: center; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <div class="r-mark">R</div>
    <span>Red Records 78</span>
  </a>
  <ul class="nav-links">
    <li><a href="index.html">Accueil</a></li>
    <li><a href="index.html#tarifs">Tarifs</a></li>
    <li><a href="instrus.html" class="active">Instrus</a></li>
    <li><a href="playlist.html">Playlist</a></li>
    <li><a href="index.html#reservation">Réserver</a></li>
  </ul>
  <a href="index.html#reservation" class="nav-cta">Prendre RDV</a>
</nav>

<div class="page-header">
  <div class="header-left">
    <div class="section-tag">Catalogue · Beats</div>
    <h1 class="section-title">Instrumentales</h1>
  </div>
  <div class="count-badge" id="count-badge"></div>
</div>

<div class="filters-wrap">
  <div class="filters" id="filters"></div>
</div>

<div class="instru-wrap">
  <div class="instru-list" id="instru-list"></div>
</div>

<footer>
  <div class="footer-logo"><span>RED</span> RECORDS 78</div>
</footer>

<div id="mini-player">
  <div class="mp-cover" id="mp-cover"><span>R</span></div>
  <div class="mp-info">
    <div class="mp-title" id="mp-title">—</div>
    <div class="mp-sub" id="mp-sub">Red Records</div>
  </div>
  <div class="mp-progress-wrap">
    <div class="mp-progress" id="mp-progress" onclick="seekAudio(event)">
      <div class="mp-progress-bar" id="mp-bar"></div>
    </div>
    <div class="mp-times"><span id="mp-cur">0:00</span><span id="mp-dur">0:00</span></div>
  </div>
  <div class="mp-controls">
    <button class="mp-btn play-pause" id="mp-play" onclick="togglePlay()">
      <svg id="mp-icon-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="mp-icon-pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>
    </button>
    <button class="mp-btn mp-close" onclick="closePlayer()">✕</button>
  </div>
</div>

<script>
// ─── FALLBACK LOCAL ───────────────────────────────────────────────────────────
const LOCAL_INSTRUS = [
  { id:'i1',  title:'Nuit en Cendres',       genre:'Trap',  bpm:'140', price:'50', src:'audio/instrus/nuit-en-cendres.mp3' },
  { id:'i2',  title:'Rue Fantôme',           genre:'Drill', bpm:'138', price:'50', src:'audio/instrus/rue-fantome.mp3' },
  { id:'i3',  title:'Pluie d\'Acier',        genre:'Trap',  bpm:'135', price:'50', src:'audio/instrus/pluie-dacier.mp3' },
  { id:'i4',  title:'Nuit sur Béton',        genre:'Drill', bpm:'136', price:'50', src:'audio/instrus/nuit-sur-beton.mp3' },
  { id:'i5',  title:'Nuits de Béton',        genre:'Drill', bpm:'134', price:'50', src:'audio/instrus/nuits-de-beton.mp3' },
  { id:'i6',  title:'Sous les Néons',        genre:'Rap FR','bpm':'128', price:'50', src:'audio/instrus/sous-les-neons.mp3' },
  { id:'i7',  title:'Boulevard Sans Échos',  genre:'Rap FR','bpm':'125', price:'50', src:'audio/instrus/boulevard-sans-echos.mp3' },
  { id:'i8',  title:'Charbon Joueux',        genre:'Afro',  bpm:'98',  price:'50', src:'audio/instrus/charbon-joueux.mp3' },
  { id:'i9',  title:'Baobab Rhumba',         genre:'Afro',  bpm:'95',  price:'50', src:'audio/instrus/baobab-rhumba.mp3' },
  { id:'i10', title:'Cobalt Laughter',       genre:'Afro',  bpm:'100', price:'50', src:'audio/instrus/cobalt-laughter.mp3' },
  { id:'i11', title:'Blessé',                genre:'Rap FR','bpm':'120', price:'50', src:'audio/instrus/blesse.mp3' },
];

// ─── CATALOGUE ────────────────────────────────────────────────────────────────
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSMGdbGRVe-iXOlvevi3Chp1NfRbApr2k2GZ1K7qWFgQSQ6QBaQTAicXx9o8V3ylQccDW_Ofc_GpU0v/pub?output=csv';
const wa = t => 'https://wa.me/33759476247?text=' + encodeURIComponent('Bonjour, je souhaite acheter l\'instrumentale "' + t + '" (50€)');

let allInstrus = [];
let activeFilter = 'Tous';

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const headers = lines[0].split(',').map(h => h.trim());
  return lines.slice(1).map(line => {
    const vals = line.split(',');
    const row = {};
    headers.forEach((h, i) => row[h] = (vals[i] || '').trim());
    return row;
  });
}

async function loadInstrus() {
  try {
    const res = await fetch(SHEET_URL);
    const text = await res.text();
    const rows = parseCSV(text);
    allInstrus = rows.filter(r => r.statut === 'disponible').map(r => ({
      id: r.id, title: r.titre, genre: r.genre, bpm: r.bpm,
      price: r.prix, src: 'audio/instrus/' + r.fichier, buyLink: wa(r.titre)
    }));
    if (allInstrus.length === 0) throw new Error('vide');
  } catch(e) {
    allInstrus = LOCAL_INSTRUS.map(t => ({ ...t, buyLink: wa(t.title) }));
  }
  buildFilters();
  renderList();
}

function buildFilters() {
  const genres = ['Tous', ...new Set(allInstrus.map(t => t.genre))];
  const wrap = document.getElementById('filters');
  wrap.innerHTML = genres.map(g =>
    `<button class="filter-btn${g === activeFilter ? ' active' : ''}" onclick="setFilter('${g}')">${g}</button>`
  ).join('');
}

function setFilter(genre) {
  activeFilter = genre;
  buildFilters();
  renderList();
}

function renderList() {
  const filtered = activeFilter === 'Tous' ? allInstrus : allInstrus.filter(t => t.genre === activeFilter);
  const list = document.getElementById('instru-list');
  document.getElementById('count-badge').textContent = filtered.length + ' beat' + (filtered.length > 1 ? 's' : '');

  if (!filtered.length) {
    list.innerHTML = '<div class="empty-msg">Aucune instru dans cette catégorie.</div>';
    return;
  }

  list.innerHTML = filtered.map((t, i) => `
    <div class="instru-row" data-id="${t.id}" onclick="playTrack('${t.id}','${t.title}','${t.genre}','${t.src}')">
      <div class="instru-num">${String(i+1).padStart(2,'0')}</div>
      <div class="instru-play-btn">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <div class="instru-info">
        <div class="instru-name">${t.title}</div>
        <div class="instru-meta">${t.bpm && t.bpm !== '—' ? t.bpm + ' BPM' : ''}</div>
      </div>
      <span class="instru-genre-tag">${t.genre}</span>
      <div class="instru-price">${t.price}<span>€</span></div>
      <a class="instru-buy-btn" href="${t.buyLink}" target="_blank" onclick="event.stopPropagation()">Acheter</a>
    </div>`
  ).join('');
}

loadInstrus();

// ─── PLAYER ──────────────────────────────────────────────────────────────────
const audio = new Audio();
let currentId = null;

function fmtTime(s) {
  if (isNaN(s)) return '0:00';
  return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
}
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  document.getElementById('mp-bar').style.width = (audio.currentTime/audio.duration*100) + '%';
  document.getElementById('mp-cur').textContent = fmtTime(audio.currentTime);
});
audio.addEventListener('loadedmetadata', () => {
  document.getElementById('mp-dur').textContent = fmtTime(audio.duration);
});
audio.addEventListener('ended', () => setPlayIcon(false));

function setPlayIcon(p) {
  document.getElementById('mp-icon-play').style.display = p ? 'none' : 'block';
  document.getElementById('mp-icon-pause').style.display = p ? 'block' : 'none';
}

function playTrack(id, title, genre, src) {
  if (currentId === id) { togglePlay(); return; }
  currentId = id;
  audio.src = src;
  audio.play().catch(() => {});
  setPlayIcon(true);
  document.getElementById('mp-title').textContent = title;
  document.getElementById('mp-sub').textContent = genre + ' · Red Records';
  document.getElementById('mini-player').classList.add('visible');
  document.querySelectorAll('.instru-row').forEach(r => r.classList.remove('active'));
  const row = document.querySelector('.instru-row[data-id="' + id + '"]');
  if (row) row.classList.add('active');
}

function togglePlay() {
  if (audio.paused) { audio.play(); setPlayIcon(true); }
  else { audio.pause(); setPlayIcon(false); }
}

function seekAudio(e) {
  const bar = document.getElementById('mp-progress');
  audio.currentTime = (e.offsetX / bar.offsetWidth) * audio.duration;
}

function closePlayer() {
  audio.pause(); audio.src = ''; currentId = null; setPlayIcon(false);
  document.getElementById('mini-player').classList.remove('visible');
  document.querySelectorAll('.instru-row').forEach(r => r.classList.remove('active'));
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
