<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Securite : empeche d'integrer la page dans une autre (anti-clickjacking) -->
  <script>if (window.top !== window.self) { try { window.top.location = window.self.location; } catch (e) { document.documentElement.style.display = 'none'; } }</script>
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Red Records — Team</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Empêche le scroll du fond sur iOS (rubber-band) */
    html { overflow: hidden; overscroll-behavior: none; }

    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface2: #1c1c1e;
      --border: rgba(255,255,255,0.08);
      --text: #f2f2f7;
      --text2: #8e8e93;
      --red: #e63946;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }

    /* ═══════════════════════════════ LOGIN ═══════════════════════════════ */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 32px 24px;
      gap: 12px;
      position: relative;
      background: radial-gradient(ellipse at 50% -10%, rgba(230,57,70,.15) 0%, transparent 55%);
    }

    .login-back {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 16px);
      left: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text2);
      font-size: 14px;
      text-decoration: none;
      background: rgba(255,255,255,0.06);
      padding: 8px 14px 8px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      transition: background 0.2s;
    }
    .login-back:active { background: rgba(255,255,255,0.1); }

    .login-eyebrow {
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--text2);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .login-title {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 30%, rgba(255,255,255,0.55) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .login-subtitle {
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 12px;
    }

    .login-field {
      width: 100%;
      max-width: 320px;
      padding: 15px 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .login-field:focus {
      border-color: rgba(230,57,70,.45);
      background: rgba(255,255,255,0.08);
    }
    .login-field::placeholder { color: var(--text2); }

    .login-btn {
      width: 100%;
      max-width: 320px;
      padding: 15px;
      background: var(--red);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.3px;
      margin-top: 4px;
      transition: opacity 0.2s, transform 0.1s;
    }
    .login-btn:active { opacity: 0.8; transform: scale(0.98); }

    #login-error {
      color: var(--red);
      font-size: 13px;
      min-height: 18px;
      text-align: center;
    }

    /* ═══════════════════════════════ APP ═══════════════════════════════ */
    #app-screen {
      display: none;
      flex-direction: column;
      position: fixed; /* position fixe : impossible de scroller le fond derrière sur iOS */
      inset: 0;
      background: var(--bg);
      overflow: hidden;
    }

    /* ── HEADER ── */
    #app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      padding-top: calc(10px + env(safe-area-inset-top, 0px));
      background: rgba(10,10,10,0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
    }

    #back-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--border);
      color: var(--text2);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    #back-btn:active { background: rgba(255,255,255,0.12); }

    .header-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }
    .header-name-row {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 15px;
      font-weight: 600;
    }
    #header-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #666;
      flex-shrink: 0;
    }
    .header-sub {
      font-size: 11px;
      color: var(--text2);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hdr-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--border);
      color: var(--text2);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .hdr-btn:active { background: rgba(255,255,255,0.12); }

    /* ── TABS ── */
    #tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tab {
      flex: 1;
      padding: 11px 10px;
      text-align: center;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab.active {
      color: var(--text);
      border-bottom-color: var(--red);
    }

    /* ═══════════════════════════════ CHAT ═══════════════════════════════ */
    #chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px 4px;
      display: flex;
      flex-direction: column;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    #messages::-webkit-scrollbar { width: 3px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    /* Date separator */
    .date-sep {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 18px 0 10px;
    }
    .date-sep span {
      font-size: 11px;
      font-weight: 500;
      color: var(--text2);
      background: var(--surface2);
      padding: 4px 11px;
      border-radius: 10px;
      letter-spacing: 0.2px;
    }

    /* Message row */
    .msg {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 82%;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .msg.new-group { margin-top: 12px; }
    .msg.grouped   { margin-top: 2px; }

    .msg.mine  { align-self: flex-end;   flex-direction: row-reverse; }
    .msg.other { align-self: flex-start; }

    /* Slide-in only for fresh messages (class added in JS) */
    .msg.pop {
      animation: msgPop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes msgPop {
      from { opacity: 0; transform: translateY(10px) scale(0.94); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Avatar */
    .msg-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .msg-avatar.ghost { visibility: hidden; }

    /* Content column — width: fit-content = bulle iMessage (taille du texte, pas toute la largeur) */
    .msg-content {
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: fit-content;
      max-width: 100%; /* ne dépasse pas le .msg (82% écran) */
      min-width: 0;
    }
    .mine  .msg-content { align-items: flex-end; }
    .other .msg-content { align-items: flex-start; }

    .msg-name {
      font-size: 11px;
      font-weight: 600;
      padding: 0 4px;
    }

    .msg-bubble {
      padding: 9px 13px;
      font-size: 15px;
      line-height: 1.45;
      word-break: break-word;
      white-space: pre-wrap;
      display: inline-block; /* clé : la bulle prend la taille de son texte, pas plus */
      max-width: 100%;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none; /* iOS : evite le menu Copier/Partager au long-press */
    }
    .other .msg-bubble {
      background: var(--surface2);
      color: var(--text);
      border-radius: 18px 18px 18px 4px;
    }
    .mine .msg-bubble {
      border-radius: 18px 18px 4px 18px;
    }
    .grouped.other .msg-bubble { border-radius: 18px; }
    .grouped.mine  .msg-bubble { border-radius: 18px; }

    .msg-time {
      font-size: 10px;
      color: var(--text2);
      padding: 0 4px;
    }

    /* RÉACTIONS — pastille compacte façon WhatsApp, chevauche le bas de la bulle */
    .msg-reactions {
      display: inline-flex;
      align-items: center;
      gap: 1px;
      margin-top: -9px;
      margin-left: 8px; margin-right: 8px;
      position: relative; z-index: 2;
      font-size: 13px;
      padding: 2px 7px;
      border-radius: 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      animation: reactPop 0.18s cubic-bezier(.2,.9,.3,1.3);
    }
    @keyframes reactPop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .msg-reactions .count { font-size: 11px; font-weight: 600; color: var(--text2); margin-left: 4px; }

    .reaction-picker {
      position: fixed;
      z-index: 998;
      display: flex;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 6px 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      animation: pickerPop 0.15s ease;
    }
    @keyframes pickerPop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .reaction-choice {
      font-size: 26px;
      background: none;
      border: none;
      padding: 4px 7px;
      cursor: pointer;
      line-height: 1;
      transition: transform 0.12s cubic-bezier(.2,.7,.2,1);
      animation: choiceIn 0.3s cubic-bezier(.2,.9,.3,1.45) both;
    }
    .reaction-choice:nth-child(2) { animation-delay: 0.05s; }
    .reaction-choice:nth-child(3) { animation-delay: 0.10s; }
    @keyframes choiceIn { from { transform: translateY(10px) scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
    .reaction-choice:active { transform: scale(1.35) translateY(-3px); }

    #reaction-who-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 999;
      align-items: flex-end;
      justify-content: center;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    #reaction-who-overlay.open { display: flex; }
    #reaction-who-modal {
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      padding: 8px 24px 28px;
      padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid var(--border);
      border-bottom: none;
      animation: sheetUp 0.32s cubic-bezier(0.34, 1.2, 0.64, 1);
    }
    #reaction-who-modal h3 { font-size: 16px; font-weight: 700; text-align: center; }
    .reaction-who-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 4px;
      font-size: 14px;
    }
    .reaction-who-row .who-emoji { margin-left: auto; font-size: 18px; }
    .reaction-who-row .who-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; flex-shrink: 0;
    }

    /* INPUT */
    #chat-input-area {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      background: rgba(10,10,10,0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    #msg-input {
      flex: 1;
      padding: 11px 16px;
      border-radius: 22px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    #msg-input:focus { border-color: rgba(230,57,70,.4); }
    #msg-input::placeholder { color: var(--text2); }

    #send-btn {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      background: var(--red);
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s, transform 0.1s;
      line-height: 1;
    }
    #send-btn:active { opacity: 0.8; transform: scale(0.9); }

    /* ═══════════════════════════════ AGENDA ═══════════════════════════════ */
    #agenda-panel {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    #open-agenda-btn {
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
    }
    #open-agenda-btn a {
      color: var(--red);
      font-size: 13px;
      text-decoration: none;
      font-weight: 600;
    }
    #agenda-panel iframe { flex: 1; border: none; width: 100%; }

    /* ═══════════════════════════════ SESSION ═══════════════════════════════ */
    #session-panel {
      flex: 1;
      display: none;
      overflow-y: auto;
      padding: 20px 16px;
      flex-direction: column;
      gap: 14px;
    }
    #session-who {
      background: var(--surface);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--border);
    }
    #session-who-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
    #session-who-name  { font-size: 15px; font-weight: 600; }
    #session-who-email { font-size: 12px; color: var(--text2); }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label {
      font-size: 11px;
      color: var(--text2);
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .form-group input, .form-group select {
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
    }
    .form-group select option { background: #1a1a1a; }
    #session-submit {
      padding: 14px;
      background: var(--red);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.2s;
    }
    #session-submit:active { opacity: 0.8; }
    #session-feedback { font-size: 14px; text-align: center; min-height: 20px; }

    /* ═══════════════════════════════ MODAL MDP ═══════════════════════════════ */
    #pw-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 999;
      align-items: flex-end;
      justify-content: center;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    #pw-modal-overlay.open { display: flex; }
    #pw-modal {
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      padding: 8px 24px 28px;
      padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border: 1px solid var(--border);
      border-bottom: none;
      animation: sheetUp 0.32s cubic-bezier(0.34, 1.2, 0.64, 1);
    }
    @keyframes sheetUp {
      from { transform: translateY(110%); }
      to   { transform: translateY(0); }
    }
    .modal-handle {
      width: 36px;
      height: 4px;
      background: rgba(255,255,255,0.14);
      border-radius: 2px;
      align-self: center;
      margin-bottom: 6px;
      margin-top: 4px;
    }
    #pw-modal h3 { font-size: 18px; font-weight: 700; text-align: center; }
    #pw-modal p  { font-size: 13px; color: var(--text2); text-align: center; line-height: 1.55; }
    #pw-modal input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    #pw-modal input:focus { border-color: rgba(230,57,70,.4); }
    #pw-modal-submit {
      padding: 14px;
      background: var(--red);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    #pw-modal-skip {
      background: none;
      border: none;
      color: var(--text2);
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      padding: 4px;
    }
    #pw-modal-error   { color: var(--red); font-size: 13px; text-align: center; min-height: 18px; }
    #pw-modal-success { color: #34c759; font-size: 15px; text-align: center; font-weight: 600; }
  </style>
</head>
<body>

  <!-- ════════ LOGIN ════════ -->
  <div id="login-screen">
    <a href="index.html" class="login-back">&#8592; Accueil</a>
    <p class="login-eyebrow">Red Records 78</p>
    <h1 class="login-title">Espace Équipe</h1>
    <p class="login-subtitle">Privé · membres seulement</p>
    <input type="email"    id="email-input"    class="login-field" placeholder="Email" autocomplete="email" />
    <input type="password" id="password-input" class="login-field" placeholder="Mot de passe" autocomplete="current-password" />
    <button id="login-btn" class="login-btn">Se connecter</button>
    <span id="login-error"></span>
  </div>

  <!-- ════════ APP ════════ -->
  <div id="app-screen">

    <!-- HEADER -->
    <div id="app-header">
      <button id="back-btn" onclick="window.location.href='index.html'">&#8592;</button>
      <div class="header-center">
        <div class="header-name-row">
          <div id="header-dot"></div>
          <span id="header-user-name">—</span>
        </div>
        <div class="header-sub">Red Records</div>
      </div>
      <div class="header-actions">
        <button id="change-pw-btn" class="hdr-btn" title="Changer mon mot de passe">🔑</button>
        <button id="logout-btn"    class="hdr-btn" title="Déconnexion">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- TABS -->
    <div id="tabs">
      <div class="tab active" id="tab-chat"   onclick="switchTab('chat')">💬 Chat</div>
      <div class="tab"        id="tab-agenda" onclick="switchTab('agenda')">📅 Agenda</div>
    </div>

    <!-- CHAT -->
    <div id="chat-panel">
      <div id="messages"></div>
      <div id="chat-input-area">
        <input type="text" id="msg-input" placeholder="Message…" autocomplete="off" />
        <button id="send-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"/>
            <polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- AGENDA -->
    <div id="agenda-panel">
      <div id="open-agenda-btn">
        <a href="https://calendar.google.com/calendar/r" target="_blank">Ouvrir Google Agenda ↗</a>
      </div>
      <iframe id="agenda-iframe" src="" allowfullscreen></iframe>
    </div>

    <!-- SESSION (réservé, non affiché dans les onglets) -->
    <div id="session-panel">
      <div id="session-who">
        <div id="session-who-dot"></div>
        <div>
          <div id="session-who-name"></div>
          <div id="session-who-email"></div>
        </div>
      </div>
      <div class="form-group">
        <label>Date de la session</label>
        <input type="date" id="s-date" />
      </div>
      <div class="form-group">
        <label>Créneau</label>
        <select id="s-creneau">
          <option value="">Peu importe / unique session</option>
          <option value="Session Jour 12h-16h">Session Jour 12h-16h</option>
          <option value="Session Jour 16h-20h">Session Jour 16h-20h</option>
          <option value="Session Soir 20h-00h">Session Soir 20h-00h</option>
          <option value="Session Nuit 00h-04h">Session Nuit 00h-04h</option>
          <option value="Format Court 2h avant 20h">Format Court 2h avant 20h</option>
          <option value="Format Court 3h avant 20h">Format Court 3h avant 20h</option>
          <option value="Format Court 2h apres 20h">Format Court 2h apres 20h</option>
          <option value="Format Court 3h apres 20h">Format Court 3h apres 20h</option>
        </select>
      </div>
      <button id="session-submit">Je prends cette session</button>
      <div id="session-feedback"></div>
    </div>

  </div>

  <!-- ════════ MODAL MOT DE PASSE ════════ -->
  <div id="pw-modal-overlay">
    <div id="pw-modal">
      <div class="modal-handle"></div>
      <h3>🔑 Mot de passe</h3>
      <p id="pw-modal-desc">Choisis ton mot de passe personnel.</p>
      <input type="password" id="pw-new"     placeholder="Nouveau mot de passe" />
      <input type="password" id="pw-confirm" placeholder="Confirmer" />
      <div id="pw-modal-error"></div>
      <button id="pw-modal-submit">Valider</button>
      <button id="pw-modal-skip">Plus tard</button>
    </div>
  </div>

  <div id="reaction-who-overlay">
    <div id="reaction-who-modal">
      <div class="modal-handle"></div>
      <h3 id="reaction-who-title">Réactions</h3>
      <div id="reaction-who-list"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, updatePassword }
      from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, deleteDoc, updateDoc, deleteField, query, orderBy, onSnapshot, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzqNa3f12PbEPuLjNQ8b9VgkA8xRt-HrwR8FsHMSvFbpsI2_drTgeeTnjCFBwKiKm132A/exec";

    const MEMBRES_DEFAUT = [
      { email: 'red@redrecords.fr',   nom: 'RED',   couleur: '#f6bf26' },
      { email: 'amoss@redrecords.fr', nom: 'Amoss', couleur: '#46d6db' },
      { email: 'remi@redrecords.fr',  nom: 'Remi',  couleur: '#d50000' },
      { email: 'baloo@redrecords.fr', nom: 'Baloo', couleur: '#33b679' },
      { email: 'juss@redrecords.fr',  nom: 'JUSS',  couleur: '#8e24aa' },
    ];

    const firebaseConfig = {
      apiKey: "AIzaSyAu9o74RjXGJyWWlVkwNgVWisAHclBtkhs",
      authDomain: "redapp-a85c9.firebaseapp.com",
      projectId: "redapp-a85c9",
      storageBucket: "redapp-a85c9.firebasestorage.app",
      messagingSenderId: "738440248376",
      appId: "1:738440248376:web:086c52e568a70702f37acd"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    let currentUser = null;
    let currentInge = null;
    let ingeMap     = {};

    // ─── HELPERS ──────────────────────────────────────────────────────────────────
    // Securite : n'accepte qu'un vrai code couleur hexa (sinon defaut) — empeche
    // d'injecter du HTML via le champ couleur dans un attribut style.
    function safeColor(c) { return (typeof c === 'string' && /^#[0-9a-fA-F]{3,8}$/.test(c)) ? c : ''; }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g,  '&amp;')
        .replace(/</g,  '&lt;')
        .replace(/>/g,  '&gt;')
        .replace(/"/g,  '&quot;');
    }

    // Returns readable text color (black or white) for a given hex bg
    function textColor(hex) {
      try {
        const r = parseInt(hex.slice(1,3), 16);
        const g = parseInt(hex.slice(3,5), 16);
        const b = parseInt(hex.slice(5,7), 16);
        const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
        return lum > 0.52 ? 'rgba(0,0,0,0.82)' : '#fff';
      } catch(e) { return '#fff'; }
    }

    function formatMsgDate(date) {
      const now       = new Date();
      const todayMs   = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      const yestMs    = todayMs - 86400000;
      const dMs       = new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime();
      if (dMs === todayMs) return "Aujourd'hui";
      if (dMs === yestMs)  return "Hier";
      return date.toLocaleDateString("fr-FR", { weekday: 'long', day: 'numeric', month: 'long' });
    }

    // ─── ACTIVITY LOGGING ─────────────────────────────────────────────────────────
    function getDevice() {
      const ua = navigator.userAgent;
      const device  = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android' : 'Desktop';
      const browser = (/Safari/.test(ua) && !/Chrome/.test(ua)) ? 'Safari' : /Chrome/.test(ua) ? 'Chrome' : /Firefox/.test(ua) ? 'Firefox' : 'Navigateur';
      return device + ' · ' + browser;
    }

    async function logActivity(type, email, nom, couleur) {
      try {
        let multi = false;
        if (type === 'login') {
          const ps = await getDocs(collection(db, 'team-presence'));
          ps.forEach(d => { if (d.id === email && d.data().online) multi = true; });
        }
        let ip = '';
        if (type === 'failed') {
          try { const r = await fetch('https://api.ipify.org?format=json'); ip = (await r.json()).ip || ''; } catch(e) {}
        }
        await addDoc(collection(db, 'team-activity'), {
          type, email: email||'', nom: nom||'', device: getDevice(),
          timestamp: serverTimestamp(), multiDevice: multi, ip
        });
        if (type === 'login') {
          await setDoc(doc(db, 'team-presence', email), {
            email, nom, couleur: couleur||'#aaa', online: true,
            device: getDevice(), lastSeen: serverTimestamp()
          });
        } else if (type === 'logout') {
          await setDoc(doc(db, 'team-presence', email),
            { online: false, lastSeen: serverTimestamp() }, { merge: true });
        }
      } catch(e) {}
    }

    // ─── MEMBERS ──────────────────────────────────────────────────────────────────
    async function chargerMembres() {
      const snap   = await getDocs(collection(db, "team-members"));
      const emails = [];
      snap.forEach(d => emails.push(d.id));
      const needsReseed = !emails.includes('red@redrecords.fr');
      if (snap.empty || needsReseed) {
        for (const m of MEMBRES_DEFAUT) await setDoc(doc(db, "team-members", m.email), m);
        MEMBRES_DEFAUT.forEach(m => ingeMap[m.email] = m);
      } else {
        snap.forEach(d => { ingeMap[d.id] = d.data(); });
      }
    }

    // ─── TABS ─────────────────────────────────────────────────────────────────────
    const AGENDA_URL = "https://calendar.google.com/calendar/embed?src=red.records78200%40gmail.com&ctz=Europe%2FParis&mode=WEEK&showTitle=0&showNav=1&showPrint=0&showTabs=0&showCalendars=0";
    let agendaLoaded = false;

    window.switchTab = function(tab) {
      ["chat", "agenda"].forEach(t => {
        document.getElementById(t + "-panel").style.display = "none";
        document.getElementById("tab-" + t).classList.remove("active");
      });
      document.getElementById(tab + "-panel").style.display = "flex";
      document.getElementById("tab-" + tab).classList.add("active");
      if (tab === "chat") {
        const m = document.getElementById("messages");
        m.scrollTop = m.scrollHeight;
      }
      if (tab === "agenda" && !agendaLoaded) {
        document.getElementById("agenda-iframe").src = AGENDA_URL;
        agendaLoaded = true;
      }
    };

    // ─── PASSWORD MODAL ───────────────────────────────────────────────────────────
    const overlay = document.getElementById("pw-modal-overlay");
    const pwDesc  = document.getElementById("pw-modal-desc");

    function openPwModal(isFirstTime) {
      document.getElementById("pw-new").value = "";
      document.getElementById("pw-confirm").value = "";
      document.getElementById("pw-modal-error").textContent = "";
      pwDesc.textContent = isFirstTime
        ? "C'est ta première connexion — choisis ton mot de passe personnel pour remplacer le mot de passe temporaire."
        : "Choisis ton nouveau mot de passe.";
      document.getElementById("pw-modal-skip").textContent = isFirstTime ? "J'ai déjà mon mot de passe" : "Plus tard";
      overlay.classList.add("open");
    }

    document.getElementById("change-pw-btn").addEventListener("click", () => openPwModal(false));
    document.getElementById("pw-modal-skip").addEventListener("click", () => {
      // "déjà fait sur un autre appareil" : on pose le flag local pour ne plus redemander ici
      if (currentUser) localStorage.setItem('rr-pw-set-' + currentUser.email, '1');
      overlay.classList.remove("open");
    });

    document.getElementById("pw-modal-submit").addEventListener("click", async () => {
      const newPw  = document.getElementById("pw-new").value;
      const confPw = document.getElementById("pw-confirm").value;
      const errEl  = document.getElementById("pw-modal-error");
      if (newPw.length < 6) { errEl.textContent = "Minimum 6 caractères."; return; }
      if (newPw !== confPw)  { errEl.textContent = "Les mots de passe ne correspondent pas."; return; }
      try {
        await updatePassword(currentUser, newPw);
        localStorage.setItem('rr-pw-set-' + currentUser.email, '1');
        errEl.textContent = "";
        document.getElementById("pw-modal").innerHTML =
          `<div id="pw-modal-success">✅ Mot de passe mis à jour !</div>`;
        setTimeout(() => overlay.classList.remove("open"), 1500);
      } catch (e) {
        errEl.textContent = e.code === "auth/requires-recent-login"
          ? "Reconnecte-toi d'abord pour changer le mot de passe."
          : "Erreur : " + e.message;
      }
    });

    // ─── AUTH ─────────────────────────────────────────────────────────────────────
    chargerMembres().then(() => {
      onAuthStateChanged(auth, (user) => {
        if (user) {
          currentUser = user;
          currentInge = ingeMap[user.email] || { nom: user.email.split("@")[0], couleur: '#aaa' };
          localStorage.setItem('rr-team', '1');
          logActivity('login', user.email, currentInge.nom, currentInge.couleur);

          // Enregistrer player ID OneSignal
          setTimeout(() => {
            try {
              const pid = (window._OS?.User?.PushSubscription?.id) || localStorage.getItem('rr-player-id') || '';
              if (pid && user.email) {
                fetch(APPS_SCRIPT_URL, {
                  method: 'POST', mode: 'no-cors',
                  body: JSON.stringify({ action: 'registerTeamMember', email: user.email, playerId: pid })
                }).catch(() => {});
              }
            } catch(e) {}
          }, 2000);

          // Update UI
          document.getElementById("header-dot").style.background = currentInge.couleur;
          document.getElementById("header-user-name").textContent = currentInge.nom;
          document.getElementById("session-who-dot").style.background = currentInge.couleur;
          document.getElementById("session-who-name").textContent = currentInge.nom;
          document.getElementById("session-who-email").textContent = user.email;

          document.getElementById("login-screen").style.display = "none";
          document.getElementById("app-screen").style.display   = "flex";

          loadMessages();
          nettoyerVieuxMessages(); // purge les messages de +7 jours

          const pwSet = localStorage.getItem('rr-pw-set-' + user.email);
          if (!pwSet) openPwModal(true);
        } else {
          currentUser = null;
          currentInge = null;
          document.getElementById("login-screen").style.display = "flex";
          document.getElementById("app-screen").style.display   = "none";
        }
      });
    });

    document.getElementById("login-btn").addEventListener("click", async () => {
      const email    = document.getElementById("email-input").value.trim();
      const password = document.getElementById("password-input").value;
      document.getElementById("login-error").textContent = "";
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (e) {
        logActivity('failed', email, '', '');
        document.getElementById("login-error").textContent = "Email ou mot de passe incorrect.";
      }
    });

    // Enter key on login
    document.getElementById("password-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("login-btn").click();
    });

    document.getElementById("logout-btn").addEventListener("click", () => {
      if (currentUser) logActivity('logout', currentUser.email, currentInge?.nom||'', currentInge?.couleur||'');
      localStorage.removeItem('rr-team');
      signOut(auth);
    });

    // Purge hebdo : on efface tout ce qui date d'avant le lundi 8h de la semaine en cours.
    // Le chat repart propre chaque lundi matin (au lieu d'un effacement glissant a +7j).
    function debutSemaineLundi8h() {
      const d = new Date();
      d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); // recule jusqu'au lundi
      d.setHours(8, 0, 0, 0);
      if (d.getTime() > Date.now()) d.setDate(d.getDate() - 7); // lundi avant 8h -> semaine d'avant
      return d.getTime();
    }

    // Suppression auto des messages d'avant lundi 8h (definitif, aucune sauvegarde)
    async function nettoyerVieuxMessages() {
      try {
        const limite = debutSemaineLundi8h();
        const snap = await getDocs(query(collection(db, "team-chat"), orderBy("timestamp", "asc")));
        const morts = [];
        snap.forEach(d => {
          const ts = d.data().timestamp?.toMillis?.() || 0;
          if (ts && ts < limite) morts.push(d.ref);
        });
        for (const ref of morts) { await deleteDoc(ref).catch(() => {}); }
      } catch(e) {}
    }

    // ─── MESSAGES ─────────────────────────────────────────────────────────────────
    function loadMessages() {
      const q = query(collection(db, "team-chat"), orderBy("timestamp", "asc"));
      let isFirstLoad  = true;
      let prevCount    = 0;

      onSnapshot(q, (snapshot) => {
        const messagesDiv = document.getElementById("messages");

        // Remember scroll position to decide whether to auto-scroll after re-render
        const wasAtBottom =
          messagesDiv.scrollHeight - messagesDiv.scrollTop - messagesDiv.clientHeight < 80;

        const newCount = snapshot.size;
        messagesDiv.innerHTML = "";

        let prevDate = null;
        let prevUid  = null;
        let idx      = 0;

        snapshot.forEach((docSnap) => {
          const msg   = docSnap.data();
          const msgId = docSnap.id;
          const isMine = msg.uid === currentUser.uid;
          const ts     = msg.timestamp?.toDate();
          const time   = ts ? ts.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : "";
          const couleur = safeColor(msg.couleur) || (isMine ? "#e63946" : "#555");

          // ── Date separator ──
          if (ts) {
            const dateKey = ts.toLocaleDateString("fr-FR");
            if (dateKey !== prevDate) {
              const sep = document.createElement("div");
              sep.className = "date-sep";
              sep.innerHTML = `<span>${escapeHtml(formatMsgDate(ts))}</span>`;
              messagesDiv.appendChild(sep);
              prevDate = dateKey;
              prevUid  = null; // reset grouping at date change
            }
          }

          // ── Grouping ──
          const sameGroup = prevUid === msg.uid;
          const initial   = (msg.name || '?')[0].toUpperCase();

          // ── Animation: only for truly new messages (not on initial batch load) ──
          const isNewMsg  = !isFirstLoad && idx >= prevCount;

          const div = document.createElement("div");
          div.className = [
            "msg",
            isMine ? "mine" : "other",
            sameGroup ? "grouped" : "new-group",
            isNewMsg ? "pop" : ""
          ].join(" ").trim();
          div.dataset.id = msgId;

          const reactionsHtml = buildReactionsHtml(msg.reactions);

          if (!isMine) {
            div.innerHTML = `
              <div class="msg-avatar${sameGroup ? ' ghost' : ''}" style="background:${couleur};color:${textColor(couleur)}">${initial}</div>
              <div class="msg-content">
                ${!sameGroup ? `<div class="msg-name" style="color:${couleur}">${escapeHtml(msg.name)}</div>` : ''}
                <div class="msg-bubble">${escapeHtml(msg.text)}</div>
                ${reactionsHtml}
                <div class="msg-time">${time}</div>
              </div>`;
          } else {
            div.innerHTML = `
              <div class="msg-content">
                <div class="msg-bubble" style="background:${couleur};color:${textColor(couleur)}">${escapeHtml(msg.text)}</div>
                ${reactionsHtml}
                <div class="msg-time">${time}</div>
              </div>`;
          }

          messagesDiv.appendChild(div);
          prevUid = msg.uid;
          idx++;
        });

        // ── Scroll to bottom ──
        if (isFirstLoad || wasAtBottom || newCount > prevCount) {
          // Use rAF so the browser has painted the new nodes before we scroll
          requestAnimationFrame(() => {
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
          });
        }

        isFirstLoad = false;
        prevCount   = newCount;
      });
    }

    // ─── RÉACTIONS ────────────────────────────────────────────────────────────────
    const REACTION_EMOJI = { heart: '❤️', like: '👍', dislike: '👎' };
    function buildReactionsHtml(reactions) {
      if (!reactions) return '';
      const entries = Object.values(reactions);
      if (!entries.length) return '';
      // Pastille façon WhatsApp : les emojis présents + le total si plusieurs
      const emojis = Object.keys(REACTION_EMOJI)
        .filter(t => entries.some(r => r.type === t))
        .map(t => REACTION_EMOJI[t]).join('');
      const count = entries.length > 1 ? `<span class="count">${entries.length}</span>` : '';
      return `<div class="msg-reactions">${emojis}${count}</div>`;
    }

    let activePicker = null;
    function closeReactionPicker() {
      if (activePicker) { activePicker.remove(); activePicker = null; }
    }

    function showReactionPicker(msgId, x, y) {
      dbg('showReactionPicker(' + (msgId || '?').slice(0,6) + ')');
      closeReactionPicker();
      const picker = document.createElement('div');
      picker.className = 'reaction-picker';
      picker.innerHTML = `<button class="reaction-choice" data-type="heart">❤️</button><button class="reaction-choice" data-type="like">👍</button><button class="reaction-choice" data-type="dislike">👎</button>`;
      document.body.appendChild(picker);
      const left = Math.min(Math.max(x - 40, 8), window.innerWidth - 90);
      const top  = Math.max(y - 56, 8);
      picker.style.left = left + 'px';
      picker.style.top  = top + 'px';
      picker.querySelectorAll('.reaction-choice').forEach(btn => {
        btn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          if (navigator.vibrate) navigator.vibrate(10); // petit retour haptique (Android)
          setReaction_(msgId, btn.dataset.type);
        });
      });
      activePicker = picker;
      setTimeout(() => document.addEventListener('click', closeReactionPicker, { once: true }), 50);
    }

    async function setReaction_(msgId, type) {
      closeReactionPicker();
      const ref  = doc(db, "team-chat", msgId);
      const snap = await getDoc(ref);
      if (!snap.exists()) return;
      const data      = snap.data();
      const reactions = data.reactions || {};
      const uid       = currentUser.uid;
      const name      = currentInge ? currentInge.nom : currentUser.email.split("@")[0];
      const field     = `reactions.${uid}`;
      const dejaMemeType = reactions[uid] && reactions[uid].type === type;

      if (dejaMemeType) {
        await updateDoc(ref, { [field]: deleteField() });
        return; // on retire sa reaction -> pas de notif
      }
      await updateDoc(ref, { [field]: { type, name } });

      // Notif façon Snap à l'auteur du message (pas à soi-même)
      const authorEmail = (data.email || '').toLowerCase();
      if (authorEmail && authorEmail !== (currentUser.email || '').toLowerCase()) {
        fetch(`${APPS_SCRIPT_URL}?action=notifyReaction&email=${encodeURIComponent(authorEmail)}&reactor=${encodeURIComponent(name)}&type=${type}`)
          .catch(() => {});
      }
    }

    async function showWhoReacted(msgId) {
      const ref  = doc(db, "team-chat", msgId);
      const snap = await getDoc(ref);
      if (!snap.exists()) return;
      const reactions = snap.data().reactions || {};
      const rows = Object.values(reactions);
      if (!rows.length) return;
      document.getElementById('reaction-who-title').textContent =
        rows.length + (rows.length > 1 ? ' réactions' : ' réaction');
      document.getElementById('reaction-who-list').innerHTML = rows.map(r => {
        const n = r.name || '?';
        const c = MEMBRES_DEFAUT.find(m => m.nom === n)?.couleur || '#888';
        return `<div class="reaction-who-row"><div class="who-avatar" style="background:${c}">${escapeHtml(n[0].toUpperCase())}</div>${escapeHtml(n)}<span class="who-emoji">${REACTION_EMOJI[r.type] || '👍'}</span></div>`;
      }).join('');
      document.getElementById('reaction-who-overlay').classList.add('open');
    }
    document.getElementById('reaction-who-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'reaction-who-overlay') e.target.classList.remove('open');
    });

    // ─── DEBUG TEMPORAIRE long-press (ouvrir team.html?debug=1) — À RETIRER après diagnostic ───
    const DEBUG_LP = new URLSearchParams(location.search).has('debug');
    let dbgEl = null;
    function dbg(msg) {
      if (!DEBUG_LP) return;
      if (!dbgEl) {
        dbgEl = document.createElement('div');
        dbgEl.style.cssText = 'position:fixed;left:8px;right:8px;bottom:90px;z-index:99999;background:rgba(0,0,0,0.88);color:#4ade80;font:11px/1.5 Menlo,monospace;padding:8px 10px;border-radius:10px;pointer-events:none;white-space:pre-wrap;max-height:45vh;overflow:hidden;';
        document.body.appendChild(dbgEl);
      }
      const t = new Date();
      const stamp = t.toTimeString().slice(0,8) + '.' + String(t.getMilliseconds()).padStart(3,'0');
      dbgEl.textContent = (stamp + '  ' + msg + '\n' + dbgEl.textContent).split('\n').slice(0, 14).join('\n');
    }
    window.addEventListener('error', (e) => dbg('❌ JS: ' + e.message + ' (L' + (e.lineno||'?') + ')'));
    window.addEventListener('unhandledrejection', (e) => dbg('❌ Promesse: ' + (e.reason && e.reason.message || e.reason)));
    dbg('debug actif — module chargé');

    // Tap sur une bulle -> picker like/dislike (l'appui long était tué par iOS, cf CERVEAU 02-04/07)
    (function attachTapReactions() {
      const messagesDiv = document.getElementById("messages");
      let pickerMsgId = null;

      messagesDiv.addEventListener('click', (e) => {
        // Tap sur la pastille de réactions -> qui a réagi (avec quoi)
        const pill = e.target.closest('.msg-reactions');
        if (pill) {
          const msgEl = pill.closest('.msg');
          showWhoReacted(msgEl.dataset.id);
          return;
        }
        // Tap sur la bulle -> ouvre le picker (re-tap sur le même message -> ferme)
        const msgEl = e.target.closest('.msg');
        if (!msgEl) return;
        e.stopPropagation(); // sinon le listener document (fermeture) tue le picker qu'on ouvre
        if (pickerMsgId === msgEl.dataset.id && activePicker) {
          dbg('re-tap même msg → fermeture');
          closeReactionPicker(); pickerMsgId = null;
          return;
        }
        dbg('tap sur msg ' + (msgEl.dataset.id || '?').slice(0,6) + ' → picker');
        pickerMsgId = msgEl.dataset.id;
        showReactionPicker(msgEl.dataset.id, e.clientX, e.clientY);
      });
      dbg('attachTapReactions OK — tap simple actif');
    })();

    // ─── SEND ─────────────────────────────────────────────────────────────────────
    async function sendMessage() {
      const msgInput = document.getElementById("msg-input");
      const text = msgInput.value.trim();
      if (!text) return;
      const name = currentInge ? currentInge.nom : currentUser.email.split("@")[0];
      msgInput.value = "";
      await addDoc(collection(db, "team-chat"), {
        text, uid: currentUser.uid, name,
        email: (currentUser.email || '').toLowerCase(),
        couleur: currentInge ? currentInge.couleur : "#e63946",
        timestamp: serverTimestamp()
      });
      fetch(APPS_SCRIPT_URL, {
        method: "POST", mode: "no-cors",
        body: JSON.stringify({ action: "message", expediteur: name, texte: text })
      }).catch(() => {});
    }

    document.getElementById("send-btn").addEventListener("click", sendMessage);
    document.getElementById("msg-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    // ─── SESSION ──────────────────────────────────────────────────────────────────
    document.getElementById("session-submit").addEventListener("click", async () => {
      const date     = document.getElementById("s-date").value;
      const creneau  = document.getElementById("s-creneau").value;
      const feedback = document.getElementById("session-feedback");
      if (!date) {
        feedback.style.color = "#e63946";
        feedback.textContent = "Sélectionne une date.";
        return;
      }
      feedback.style.color = "#aaa";
      feedback.textContent = "En cours...";
      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ type: "prendreSession", dateStr: date, creneau, inge: currentInge.nom })
      }).catch(() => {});
      feedback.style.color = "#34c759";
      feedback.textContent = "Session prise ! L'agenda va se mettre à jour.";
    });
  </script>

</body>
</html>
