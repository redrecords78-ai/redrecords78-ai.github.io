<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playlist · Red Records 78</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E8192C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --red: #E8192C; --red2: #FF3347;
  --black: #080808; --black2: #0F0F0F; --black3: #161616; --black4: #1E1E1E;
  --white: #F2F2F2; --gray: #888; --gray2: #444;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; overflow-x: hidden; }
body {
  background: var(--black); color: var(--white);
  font-family: 'DM Sans', sans-serif; font-weight: 300;
  line-height: 1.6; overflow-x: hidden; padding-bottom: 80px;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 999; opacity: 0.4;
}

/* NAV */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  padding: 1.25rem 2rem;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  background: rgba(8,8,8,0.9); backdrop-filter: blur(12px);
}
.nav-back { color: var(--gray); display: flex; align-items: center; padding: 6px; transition: color 0.2s; }
.nav-back:hover { color: var(--white); }
.nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.nav-logo .r-mark {
  width: 36px; height: 36px; border-radius: 10px;
  object-fit: cover; display: block; flex-shrink: 0;
}
.nav-logo span { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px; color: var(--white); }
.nav-links { display: flex; gap: 1.5rem; list-style: none; }
.nav-links a { color: var(--gray); text-decoration: none; font-size: 13px; letter-spacing: 0.05em; transition: color 0.2s; }
.nav-links a:hover { color: var(--white); }
.nav-links a.active { color: var(--red); }
.nav-cta {
  background: var(--red); color: white !important;
  padding: 8px 18px; font-size: 13px; text-decoration: none; letter-spacing: 0.05em; transition: background 0.2s;
}
.nav-cta:hover { background: var(--red2); }

/* PAGE HEADER */
.page-header { padding: 7rem 2rem 2rem; max-width: 1000px; margin: 0 auto; }
.section-tag {
  font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--red); margin-bottom: 1rem; display: flex; align-items: center; gap: 10px;
}
.section-tag::before { content: ''; display: block; width: 24px; height: 1px; background: var(--red); }
.section-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(36px, 6vw, 60px); letter-spacing: 2px; line-height: 1; margin-bottom: 2rem; }

/* PLAYLIST */
.playlist-wrap { max-width: 1000px; margin: 0 auto; padding: 0 2rem 4rem; }
.playlist-list { display: flex; flex-direction: column; gap: 1px; background: var(--gray2); }
.playlist-track {
  background: var(--black2); padding: 1.25rem 1.75rem;
  display: flex; align-items: center; gap: 1.25rem;
  transition: background 0.2s; cursor: pointer;
}
.playlist-track:hover { background: var(--black3); }
.playlist-track.active { background: var(--black3); border-left: 2px solid var(--red); }
.playlist-num { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--gray2); min-width: 28px; text-align: center; }
.playlist-track.active .playlist-num { color: var(--red); }
.playlist-play-btn {
  width: 38px; height: 38px; border: 1px solid var(--gray2); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s;
}
.playlist-track:hover .playlist-play-btn { border-color: var(--white); }
.playlist-track.active .playlist-play-btn { border-color: var(--red); background: rgba(232,25,44,0.1); }
.playlist-info { flex: 1; min-width: 0; }
.playlist-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.playlist-artist { font-size: 12px; color: var(--gray); margin-top: 2px; }
.playlist-genre { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gray2); margin-top: 4px; }

/* MINI PLAYER */
#mini-player {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  background: rgba(15,15,15,0.97); backdrop-filter: blur(20px);
  border-top: 1px solid var(--gray2);
  padding: 0 1.5rem; height: 72px; display: none; align-items: center; gap: 1rem;
}
#mini-player.visible { display: flex; }
.mp-cover {
  width: 44px; height: 44px; background: var(--black3);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--red);
}
.mp-info { flex: 1; min-width: 0; }
.mp-title { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 1px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mp-sub { font-size: 11px; color: var(--gray); margin-top: 2px; }
.mp-progress-wrap { flex: 1.5; display: flex; flex-direction: column; gap: 6px; }
.mp-times { display: flex; justify-content: space-between; font-size: 10px; color: var(--gray); }
#mp-seek {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 4px; border-radius: 2px;
  outline: none; cursor: pointer;
  background: linear-gradient(to right, var(--red) 0%, var(--gray2) 0%);
}
#mp-seek::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--red); cursor: pointer;
  box-shadow: 0 0 6px rgba(232,25,44,0.6);
}
#mp-seek::-moz-range-thumb {
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--red); cursor: pointer; border: none;
  box-shadow: 0 0 6px rgba(232,25,44,0.6);
}
.mp-controls { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.mp-btn { background: none; border: none; color: var(--white); cursor: pointer; padding: 6px; display: flex; align-items: center; justify-content: center; transition: color 0.2s; }
.mp-btn:hover { color: var(--red); }
.mp-btn.play-pause { width: 38px; height: 38px; border: 1px solid var(--gray2); border-radius: 50%; }
.mp-btn.play-pause:hover { border-color: var(--red); }
.mp-close { color: var(--gray); font-size: 18px; }

/* FOOTER */
footer { border-top: 1px solid var(--gray2); padding: 2rem; display: flex; align-items: center; justify-content: space-between; max-width: 1000px; margin: 0 auto; }
.footer-logo { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 3px; color: var(--gray); }
.footer-logo span { color: var(--red); }

#bottom-nav {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 150;
  background: rgba(8,8,8,0.97); backdrop-filter: blur(12px);
  border-top: 1px solid var(--gray2); height: 56px;
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none; -ms-overflow-style: none;
}
#bottom-nav::-webkit-scrollbar { display: none; }
.bn-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  text-decoration: none; color: var(--gray);
  font-size: 8px; letter-spacing: 0.04em; text-transform: uppercase;
  transition: color 0.2s; white-space: nowrap; min-width: 0;
}
.bn-item.active, .bn-item:hover { color: var(--red); }
.bn-item svg { width: 16px; height: 16px; flex-shrink: 0; }

@media (max-width: 700px) {
  .nav-links { display: none; }
  footer { flex-direction: column; gap: 1rem; text-align: center; }
  #bottom-nav { display: flex; top: 70px; bottom: auto; }
  #mini-player { bottom: 16px; flex-wrap: wrap; height: auto; padding: 10px 1rem; gap: 8px; }
  .mp-progress-wrap { order: 3; flex: 0 0 100%; }
  body { padding-top: 130px; padding-bottom: 80px; }
}
</style>
</head>

</footer>

<!-- MINI PLAYER -->
<div id="mini-player">
  <div class="mp-cover" id="mp-cover"><span>R</span></div>
  <div class="mp-info">
    <div class="mp-title" id="mp-title">—</div>
    <div class="mp-sub" id="mp-sub">Red Records</div>
  </div>
  <div class="mp-progress-wrap">
    <input type="range" id="mp-seek" min="0" max="100" value="0" step="0.1">
    <div class="mp-times"><span id="mp-cur">0:00</span><span id="mp-dur">0:00</span></div>
  </div>
  <div class="mp-controls">
    <button class="mp-btn play-pause" id="mp-play" onclick="togglePlay()">
      <svg id="mp-icon-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="mp-icon-pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>
    </button>
    <button class="mp-btn mp-close" onclick="closePlayer()">✕</button>
  </div>
</div>

<script>
// ─── PLAYLIST ─────────────────────────────────────────────────────────────────
// Pour ajouter un son : copier un objet, mettre le fichier dans audio/playlist/
const PLAYLIST = [
  { id: 'p1', title: '100 PAS',          artist: 'DJIBS',     genre: 'Rap FR', src: 'audio/playlist/DJIBS - 100 PAS.mp3' },
  { id: 'p2', title: 'ANKARA',           artist: 'LACOMETE',  genre: 'Rap FR', src: 'audio/playlist/LACOMETE - ANKARA.mp3' },
  { id: 'p3', title: 'BIENTÔT ON Y EST', artist: 'RZOUKI',    genre: 'Rap FR', src: "audio/playlist/RZOUKI - BIENTÔT ON Y EST.mp3" },
  { id: 'p4', title: 'BALAFRE',          artist: 'THYSMA',    genre: 'Rap FR', src: 'audio/playlist/THYSMA - BALAFRE.mp3' },
  { id: 'p5', title: 'RESPECTE',         artist: 'ZÉRO NEUF', genre: 'Rap FR', src: "audio/playlist/ZÉRO NEUF - RESPECTE.mp3" },
];

const plList = document.getElementById('playlist-list');
PLAYLIST.forEach((t, i) => {
  plList.innerHTML += `
  <div class="playlist-track" data-id="${t.id}" onclick="playTrack('${t.id}','${t.title}','${t.artist}','${t.src}')">
    <div class="playlist-num">${String(i+1).padStart(2,'0')}</div>
    <div class="playlist-play-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <div class="playlist-info">
      <div class="playlist-title">${t.title}</div>
      <div class="playlist-artist">${t.artist}</div>
      <div class="playlist-genre">${t.genre}</div>
    </div>
  </div>`;
});

// PLAYER
const audio = new Audio();
let currentId = null;

function fmtTime(s) {
  if (isNaN(s)) return '0:00';
  return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
}
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration * 100);
  const seek = document.getElementById('mp-seek');
  seek.value = pct;
  seek.style.background = `linear-gradient(to right, var(--red) ${pct}%, var(--gray2) ${pct}%)`;
  document.getElementById('mp-cur').textContent = fmtTime(audio.currentTime);
});
document.getElementById('mp-seek').addEventListener('input', function() {
  if (audio.duration) audio.currentTime = (this.value / 100) * audio.duration;
});
audio.addEventListener('loadedmetadata', () => { document.getElementById('mp-dur').textContent = fmtTime(audio.duration); });
audio.addEventListener('ended', () => setPlayIcon(false));

function setPlayIcon(p) {
  document.getElementById('mp-icon-play').style.display = p ? 'none' : 'block';
  document.getElementById('mp-icon-pause').style.display = p ? 'block' : 'none';
}

function playTrack(id, title, sub, src) {
  if (currentId === id) { togglePlay(); return; }
  currentId = id;
  audio.src = src;
  audio.play().catch(() => {});
  setPlayIcon(true);
  document.getElementById('mp-title').textContent = title;
  document.getElementById('mp-sub').textContent = sub;
  document.getElementById('mini-player').classList.add('visible');
  document.querySelectorAll('.playlist-track').forEach(t => t.classList.remove('active'));
  const track = document.querySelector('.playlist-track[data-id="' + id + '"]');
  if (track) track.classList.add('active');
}

function togglePlay() {
  if (audio.paused) { audio.play(); setPlayIcon(true); }
  else { audio.pause(); setPlayIcon(false); }
}


function closePlayer() {
  audio.pause(); audio.src = ''; currentId = null; setPlayIcon(false);
  document.getElementById('mini-player').classList.remove('visible');
  document.querySelectorAll('.playlist-track').forEach(t => t.classList.remove('active'));
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
