<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Spécialiste detailing moto &amp; auto à Vénissieux. Réservez en ligne.">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DCL">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Detailing Center Lyon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#0A0A0A;
  --surface:#121212;
  --surface-2:#1C1C1C;
  --line:#272727;
  --ink:#F0EDE8;
  --ink-2:#888480;
  --ink-3:#484440;
  --gold:#C9A84C;
  --gold-l:#E8C96A;
  --gold-d:#8A6E28;
  --gold-glow:rgba(201,168,76,.28);
  --display:"Saira Condensed","Arial Narrow",sans-serif;
  --body:"Inter",-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  background:var(--ground);color:var(--ink);
  font-family:var(--body);-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{-webkit-tap-highlight-color:transparent;font-family:inherit;cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
input,textarea{font-family:inherit;font-size:16px}
[hidden]{display:none!important}

/* ── PAGE ── */
.page{max-width:480px;margin:0 auto;min-height:100dvh;padding-bottom:96px}

/* ── HERO ── */
.hero{
  position:relative;min-height:320px;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:28px 22px 26px;overflow:hidden;
}
/* Motif hexagone CSS — clin d'œil au plafond LED */
.hero-bg{
  position:absolute;inset:0;
  background:
    linear-gradient(180deg,rgba(10,10,10,0) 0%,rgba(10,10,10,.6) 45%,var(--ground) 100%),
    radial-gradient(ellipse 80% 50% at 50% 0%,rgba(201,168,76,.08),transparent),
    repeating-linear-gradient(0deg,transparent,transparent 29px,rgba(201,168,76,.06) 29px,rgba(201,168,76,.06) 30px),
    repeating-linear-gradient(60deg,transparent,transparent 29px,rgba(201,168,76,.04) 29px,rgba(201,168,76,.04) 30px),
    repeating-linear-gradient(120deg,transparent,transparent 29px,rgba(201,168,76,.04) 29px,rgba(201,168,76,.04) 30px);
  background-color:#0E0C0A;
}
/* Logo */
.hero-logo{
  position:absolute;top:22px;left:22px;
  display:flex;align-items:center;gap:10px;z-index:1;
}
.logo-mark{
  width:38px;height:38px;border-radius:8px;flex:none;
  background:linear-gradient(135deg,var(--gold-d),var(--gold),var(--gold-l));
  display:grid;place-items:center;
}
.logo-mark span{
  font-family:var(--display);font-weight:900;font-size:13px;
  letter-spacing:.5px;color:#0A0A0A;
}
.logo-name{
  font-family:var(--display);font-weight:800;font-size:15px;
  letter-spacing:2.2px;text-transform:uppercase;line-height:1.1;
}
.logo-name small{
  display:block;font-size:10px;font-weight:600;letter-spacing:2px;
  color:var(--ink-2);
}
/* Badge ville */
.hero-badge{
  position:absolute;top:22px;right:22px;z-index:1;
  background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.3);
  border-radius:999px;padding:5px 12px;
  font-family:var(--display);font-weight:700;font-size:11px;
  letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);
}
/* Titre hero */
.hero h1{
  font-family:var(--display);font-weight:900;font-size:52px;
  line-height:.92;text-transform:uppercase;letter-spacing:1px;
  position:relative;z-index:1;
}
.hero h1 em{
  font-style:normal;
  background:linear-gradient(90deg,var(--gold),var(--gold-l));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p{
  margin-top:12px;font-size:12px;color:var(--ink-2);
  letter-spacing:2px;text-transform:uppercase;position:relative;z-index:1;
}

/* ── CATEGORIE CHIPS ── */
.cats{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  padding:24px 20px 0;
}
.cat-btn{
  background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:22px 14px;text-align:center;
  transition:border-color .12s,background .12s;
}
.cat-btn:active{background:var(--surface-2)}
.cat-btn .cat-icon{font-size:30px;margin-bottom:9px;display:block}
.cat-btn .cat-label{
  font-family:var(--display);font-weight:800;font-size:18px;
  letter-spacing:1.5px;text-transform:uppercase;
}
.cat-btn .cat-count{font-size:11px;color:var(--ink-2);margin-top:4px}

/* ── SECTION HEADER ── */
.sec{padding:0 20px}
.sec-title{
  font-family:var(--display);font-weight:700;font-size:11px;
  letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);
  margin:32px 0 14px;display:flex;align-items:center;gap:10px;
}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}

/* ── SERVICE CARDS ── */
.svc{
  background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:15px 16px;margin-bottom:9px;
  display:flex;align-items:center;gap:14px;
  border-left:3px solid transparent;cursor:pointer;
  transition:border-left-color .12s,background .12s;
}
.svc[aria-pressed=true]{
  border-left-color:var(--gold);
  background:rgba(201,168,76,.07);
}
.svc:active{background:var(--surface-2)}
.svc-body{flex:1;min-width:0}
.svc-name{font-weight:600;font-size:15px;line-height:1.2}
.svc-desc{font-size:12px;color:var(--ink-2);margin-top:3px}
.svc-price{
  font-family:"IBM Plex Mono","SF Mono",monospace;
  font-weight:600;font-size:13.5px;color:var(--gold);flex:none;
}

/* ── FORMULAIRE ── */
.f-label{
  display:block;font-size:10px;letter-spacing:1.8px;text-transform:uppercase;
  color:var(--ink-3);margin:20px 0 8px;
}
.f-label:first-child{margin-top:0}
.f-opt{color:var(--ink-3);font-size:9.5px;letter-spacing:0;text-transform:none}
input[type=text],input[type=tel],input[type=date],textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:14px 16px;color:var(--ink);
  appearance:none;-webkit-appearance:none;
}
input:focus,textarea:focus{
  outline:2px solid var(--gold);outline-offset:2px;border-color:transparent;
}
textarea{resize:none;height:88px;line-height:1.55}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=date]::-webkit-calendar-picker-indicator{
  filter:invert(.45) sepia(1) hue-rotate(5deg) saturate(1.8);
}
/* Récap prestation choisie */
.svc-recap{
  background:var(--surface);border:1px solid rgba(201,168,76,.4);
  border-radius:10px;padding:14px 16px;margin-bottom:20px;
  display:flex;align-items:center;gap:12px;
}
.svc-recap .emoji{font-size:20px;flex:none}
.svc-recap .info{flex:1}
.svc-recap .info strong{font-weight:600;font-size:15px}
.svc-recap .info span{font-size:12px;color:var(--gold);margin-left:6px}
.svc-recap .change{
  font-size:12px;color:var(--ink-2);padding:6px 10px;
  border:1px solid var(--line);border-radius:8px;
}

/* ── INFOS CONTACT ── */
.info-row{
  display:flex;align-items:flex-start;gap:12px;
  padding:13px 0;border-bottom:1px solid var(--line);
  font-size:14px;color:var(--ink-2);line-height:1.4;
}
.info-row:last-child{border-bottom:none}
.info-row .ico{font-size:17px;flex:none;margin-top:1px}
.info-row a{color:var(--gold)}

/* ── CTA STICKY ── */
.cta-wrap{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:min(480px,100vw);
  padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));
  background:rgba(10,10,10,.92);backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);z-index:50;
}
.cta{
  width:100%;height:56px;border-radius:12px;
  background:linear-gradient(135deg,var(--gold-d) 0%,var(--gold) 50%,var(--gold-l) 100%);
  color:#0A0A0A;
  font-family:var(--display);font-weight:900;font-size:18px;
  letter-spacing:2px;text-transform:uppercase;
  box-shadow:0 6px 24px var(--gold-glow);
}
.cta:active{filter:brightness(.88)}
.cta:disabled{
  background:var(--surface-2);color:var(--ink-3);
  box-shadow:none;cursor:not-allowed;
}

/* ── BACK LINK ── */
.back-link{
  display:block;width:100%;padding:12px 0;text-align:center;
  font-size:13px;color:var(--ink-2);margin-top:6px;
}
.back-link:active{color:var(--ink)}

/* ── FOOTER ── */
footer{
  padding:32px 20px calc(32px + env(safe-area-inset-bottom,0px));
  text-align:center;
}
.footer-brand{
  font-family:var(--display);font-weight:900;font-size:12px;
  letter-spacing:3px;text-transform:uppercase;color:var(--ink-3);
}
.footer-addr{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.5}
.socials{display:flex;justify-content:center;gap:10px;margin-top:16px}
.socials a{
  width:42px;height:42px;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;
  display:grid;place-items:center;font-size:19px;
}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
  padding:12px 22px;border-radius:999px;font-size:14px;
  opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:200;
  box-shadow:0 8px 24px rgba(0,0,0,.6);white-space:nowrap;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── TRANSITION ── */
#view{transition:opacity .13s ease}
#view.fade{opacity:0}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="page">

  <!-- HERO -->
  <div class="hero">
    <div class="hero-bg"></div>
    <div class="hero-logo">
      <div class="logo-mark"><span>DCL</span></div>
      <div class="logo-name">Detailing Center<small>Lyon</small></div>
    </div>
    <div class="hero-badge">Vénissieux</div>
    <h1>L'excellence<br><em>détail<br>par détail.</em></h1>
    <p>Moto · Automobile · Sur rendez-vous</p>
  </div>

  <!-- VUE DYNAMIQUE -->
  <div id="view"></div>

  <!-- FOOTER -->
  <footer>
    <div class="footer-brand">Detailing Center Lyon</div>
    <div class="footer-addr">388 Av. Charles de Gaulle, Bloc 117<br>69200 Vénissieux</div>
    <div class="socials">
      <a href="tel:0668163064" aria-label="Appeler">📞</a>
      <a href="https://instagram.com" target="_blank" rel="noopener" aria-label="Instagram">📸</a>
      <a href="https://tiktok.com" target="_blank" rel="noopener" aria-label="TikTok">🎵</a>
      <a href="https://maps.google.com/?q=388+Av+Charles+de+Gaulle+Venissieux" target="_blank" rel="noopener" aria-label="Maps">📍</a>
    </div>
  </footer>

</div>

<!-- CTA STICKY -->
<div class="cta-wrap">
  <button class="cta" id="ctaBtn" disabled>Réserver</button>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

var WA = "33668163064";

var CATS = {
  moto:{
    label:"Moto", emoji:"🏍️",
    items:[
      {id:"logo-led",   name:"Logo LED",            desc:"Personnalisation lumineuse",      price:"dès 90 €"},
      {id:"crash-bar",  name:"Crash bar",            desc:"Peinture & finition sur mesure",  price:"dès 180 €"},
      {id:"antibrou",   name:"Antibrouillards",      desc:"Pose de feux additionnels",       price:"dès 120 €"},
      {id:"sabot",      name:"Sabot moteur",         desc:"Protection carénage",             price:"dès 110 €"},
      {id:"feu-arr",    name:"Feu arrière",          desc:"Remplacement & perso",            price:"dès 100 €"},
      {id:"selle",      name:"Housse de selle",      desc:"Cuir & tissu sur mesure",         price:"dès 120 €"},
      {id:"detail-moto",name:"Detailing moto",       desc:"Nettoyage complet & protection",  price:"dès 50 €"}
    ]
  },
  auto:{
    label:"Auto", emoji:"🚗",
    items:[
      {id:"nettoyage",  name:"Nettoyage complet",    desc:"Intérieur & extérieur",           price:"dès 100 €"},
      {id:"lustrage",   name:"Lustrage",             desc:"Restitution de l'éclat",          price:"dès 100 €"},
      {id:"polissage",  name:"Polissage",            desc:"Correction de peinture",          price:"100–350 €"},
      {id:"ceramique",  name:"Traitement céramique", desc:"Protection longue durée",         price:"dès 500 €"},
      {id:"ppf",        name:"Film PPF",             desc:"Protection anti-gravillon",       price:"Sur devis"},
      {id:"cuir",       name:"Soin du cuir",         desc:"Nettoyage & hydratation",         price:"dès 80 €"}
    ]
  }
};

var state = {step:1, cat:null, svc:null};

/* ──── utilitaires ──── */
function esc(s){
  return String(s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}
function toast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("on");
  setTimeout(function(){t.classList.remove("on");},2400);
}
function today(){
  var d=new Date(),m=d.getMonth()+1,j=d.getDate();
  return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(j<10?"0":"")+j;
}
function go(fn){
  var v=document.getElementById("view");
  v.classList.add("fade");
  setTimeout(function(){fn();v.classList.remove("fade");},120);
}
function cta(label,enabled,fn){
  var b=document.getElementById("ctaBtn");
  b.textContent=label; b.disabled=!enabled; b.onclick=enabled?fn:null;
}

/* ──── STEP 1 — Accueil ──── */
function renderHome(){
  state.step=1;
  var html='<div class="cats">';
  ["moto","auto"].forEach(function(k){
    var c=CATS[k];
    html+='<button class="cat-btn" id="cat-'+k+'">' +
      '<span class="cat-icon">'+c.emoji+'</span>' +
      '<span class="cat-label">'+c.label+'</span>' +
      '<span class="cat-count">'+c.items.length+' prestations</span>' +
      '</button>';
  });
  html+='</div>';
  html+='<div class="sec"><div class="sec-title">Nous contacter</div>';
  html+='<div class="info-row"><span class="ico">📍</span><span>388 Av. Charles de Gaulle, Bloc 117 · 69200 Vénissieux</span></div>';
  html+='<div class="info-row"><span class="ico">📞</span><span><a href="tel:0668163064">06 68 16 30 64</a></span></div>';
  html+='<div class="info-row"><span class="ico">✉️</span><span><a href="mailto:contact.detailingcenterlyon@gmail.com">contact.detailingcenterlyon@gmail.com</a></span></div>';
  html+='</div>';
  document.getElementById("view").innerHTML=html;
  document.getElementById("cat-moto").onclick=function(){state.cat="moto";state.svc=null;go(renderServices);};
  document.getElementById("cat-auto").onclick=function(){state.cat="auto";state.svc=null;go(renderServices);};
  cta("Réserver",false);
}

/* ──── STEP 2 — Services ──── */
function renderServices(){
  state.step=2;
  var cat=CATS[state.cat];
  var html='<div class="sec"><div class="sec-title">'+cat.emoji+' '+cat.label+' — Choisir une prestation</div>';
  cat.items.forEach(function(item){
    html+='<div class="svc" role="button" tabindex="0" aria-pressed="false" data-id="'+item.id+'">' +
      '<div class="svc-body"><div class="svc-name">'+esc(item.name)+'</div><div class="svc-desc">'+esc(item.desc)+'</div></div>' +
      '<div class="svc-price">'+esc(item.price)+'</div></div>';
  });
  html+='<button class="back-link" id="backHome">← Retour à l\'accueil</button></div>';
  document.getElementById("view").innerHTML=html;

  document.getElementById("view").addEventListener("click",function(e){
    var card=e.target.closest(".svc");
    if(!card) return;
    document.querySelectorAll(".svc").forEach(function(c){c.setAttribute("aria-pressed","false");});
    card.setAttribute("aria-pressed","true");
    state.svc=card.getAttribute("data-id");
    cta("Choisir cette prestation",true,function(){go(renderForm);});
  });
  document.getElementById("backHome").onclick=function(){state.cat=null;go(renderHome);};
  cta("Choisir une prestation",false);
}

/* ──── STEP 3 — Formulaire ──── */
function renderForm(){
  state.step=3;
  var cat=CATS[state.cat];
  var item=cat.items.filter(function(i){return i.id===state.svc;})[0];
  var html='<div class="sec">';
  html+='<div class="sec-title">📝 Votre demande de RDV</div>';
  html+='<div class="svc-recap">' +
    '<span class="emoji">'+cat.emoji+'</span>' +
    '<span class="info"><strong>'+esc(item.name)+'</strong><span>'+esc(item.price)+'</span></span>' +
    '<button class="change" id="changePresta">Changer</button>' +
    '</div>';
  html+='<label class="f-label" for="f-prenom">Votre prénom</label>';
  html+='<input type="text" id="f-prenom" placeholder="Ex. Karim" autocomplete="given-name">';
  html+='<label class="f-label" for="f-tel">Votre téléphone</label>';
  html+='<input type="tel" id="f-tel" placeholder="06 XX XX XX XX" autocomplete="tel">';
  html+='<label class="f-label">Votre véhicule</label>';
  html+='<div class="two"><input type="text" id="f-marque" placeholder="Marque · ex. BMW" autocomplete="off"><input type="text" id="f-modele" placeholder="Modèle · ex. GS 1250" autocomplete="off"></div>';
  html+='<label class="f-label" for="f-date">Date souhaitée</label>';
  html+='<input type="date" id="f-date" min="'+today()+'">';
  html+='<label class="f-label" for="f-note">Précisions <span class="f-opt">— optionnel</span></label>';
  html+='<textarea id="f-note" placeholder="Couleur, état de la peinture, demande particulière..."></textarea>';
  html+='<button class="back-link" id="backSvc">← Changer de prestation</button>';
  html+='</div>';
  document.getElementById("view").innerHTML=html;

  function check(){
    var ok=document.getElementById("f-prenom").value.trim()!==""&&
           document.getElementById("f-tel").value.trim()!=="";
    cta("Envoyer sur WhatsApp ✓",ok,ok?sendWa:null);
  }
  ["f-prenom","f-tel","f-marque","f-modele","f-date"].forEach(function(id){
    document.getElementById(id).addEventListener("input",check);
  });
  document.getElementById("changePresta").onclick=function(){go(renderServices);};
  document.getElementById("backSvc").onclick=function(){go(renderServices);};
  cta("Envoyer sur WhatsApp ✓",false);
}

/* ──── WhatsApp ──── */
function sendWa(){
  var cat=CATS[state.cat];
  var item=cat.items.filter(function(i){return i.id===state.svc;})[0];
  var prenom=document.getElementById("f-prenom").value.trim();
  var tel=document.getElementById("f-tel").value.trim();
  var marque=document.getElementById("f-marque").value.trim();
  var modele=document.getElementById("f-modele").value.trim();
  var date=document.getElementById("f-date").value;
  var note=document.getElementById("f-note").value.trim();

  var msg="🔧 Nouvelle demande de RDV — DCL\n\n";
  msg+="👤 "+prenom+" · "+tel+"\n";
  msg+=cat.emoji+" "+cat.label+" · "+item.name+" ("+item.price+")\n";
  if(marque||modele) msg+="🚘 "+(marque+" "+modele).trim()+"\n";
  if(date){
    var d=new Date(date);
    var j=["dim","lun","mar","mer","jeu","ven","sam"][d.getDay()];
    var mois=["jan","fév","mar","avr","mai","juin","juil","aoû","sep","oct","nov","déc"][d.getMonth()];
    msg+="📅 "+j+". "+d.getDate()+" "+mois+"\n";
  }
  if(note) msg+="📝 "+note+"\n";

  window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(msg),"_blank");
  toast("Ouverture de WhatsApp…");
}

/* ──── init ──── */
renderHome();

})();
</script>
</body>
</html>
